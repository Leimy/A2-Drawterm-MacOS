<h1>A2 Web Browser</h1>
<p>This is A2's original BimBrowser, running natively on Apple Silicon.</p>
<p>Enter an <b>http://</b> address in the bar above and click Go. You can also
open local documents with <b>file://</b> URLs.</p>
<p>HTTPS and modern web features are not implemented by this historical browser.</p>
